# Tested environment (Linux x86-64, NVIDIA GPU, CUDA 12.8 driver or newer). After creating it, install CLIP, whose
# setup.py needs the setuptools installed here (with pkg_resources), so it cannot go in this file:
#
#   conda env create -f environment.yml
#   conda activate wavedino
#   pip install --no-build-isolation git+https://github.com/openai/CLIP.git@dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1
#
# package-list.txt is the full package list of the environment the paper's results were produced with.
name: wavedino
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # CLIP's setup.py needs pkg_resources, which setuptools >= 81 no longer ships
  - setuptools=80.9
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      # DINOv3 needs transformers >= 4.56
      - transformers==4.57.3
      - huggingface-hub==0.36.0
      - timm==1.0.15
      - einops==0.8.1
      - numpy==2.3.0
      - scipy==1.15.3
      - pandas==2.3.0
      - matplotlib==3.10.3
      - scikit-image==0.26.0
      - opencv-python==4.11.0.86
      - tifffile==2025.6.1
      - h5py==3.14.0
      - astropy==7.1.0
      - torchmetrics==1.7.2
      - piqa==1.3.2
      - tensorboard==2.20.0
      # prebuilt mamba-ssm for this PyTorch (its source package needs nvcc); the selective-scan kernels are the same as
      # in the build the paper used (2.2.4 + 7 commits)
      - https://github.com/state-spaces/mamba/releases/download/v2.2.5/mamba_ssm-2.2.5%2Bcu12torch2.7cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
      - packaging==25.0
      - ninja==1.11.1.4
      # diffusion baseline (latent-diffusion code)
      - kornia==0.8.1
      - pytorch-lightning==2.5.1.post0
      - taming-transformers==0.0.1
      - omegaconf==2.3.0
      - pyyaml==6.0.2
      - ftfy==6.3.1
      - regex==2024.11.6
      - tqdm==4.67.1
